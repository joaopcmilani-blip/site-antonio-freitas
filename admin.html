<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Antonio Freitas</title><style>body{font-family:system-ui;background:#130e1b;color:#fff;margin:0;padding:25px}main{max-width:900px;margin:auto}h1{color:#e7c47b}input,textarea,select,button{font:inherit;padding:12px;border-radius:8px;border:1px solid #888}input,textarea,select{background:#261e32;color:white;width:100%;box-sizing:border-box}label{display:block;margin:12px 0}button{background:#e7c47b;color:#171020;cursor:pointer;margin:5px 5px 5px 0}article{border:1px solid #60516e;border-radius:12px;padding:16px;margin:12px 0}a{color:#e7c47b}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}</style></head><body><main><p><a href="/">← Voltar ao site</a></p><h1>Agenda de shows — Administração</h1><p id="notice" role="status"></p><section id="login"><h2>Entrar</h2><form id="login-form"><label>E-mail<input id="email" type="email" value="joaopcmilani@gmail.com" required></label><label>Senha<input id="password" type="password" required></label><button>Entrar</button></form><p><button type="button" id="forgot-password">Esqueci minha senha</button></p><p>Utilize a senha da sua conta já cadastrada no Supabase. Não compartilhe sua senha.</p></section><section id="panel" class="hidden"><button id="logout">Sair</button><h2 id="form-title">Cadastrar show</h2><form id="show-form"><div class="grid"><label>Título<input name="titulo" required></label><label>Data<input name="data" type="date" required></label><label>Horário<input name="horario" type="time"></label><label>Local<input name="local" required></label><label>Cidade<input name="cidade"></label><label>Status<select name="status"><option value="ativo">Ativo</option><option value="rascunho">Rascunho</option><option value="cancelado">Cancelado</option></select></label></div><label>Descrição<textarea name="descricao"></textarea></label><label>Enviar cartaz do computador<input id="cartaz-arquivo" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></label><p id="cartaz-feedback" role="status">Selecione uma imagem (JPG, PNG, WEBP ou GIF, até 5 MB). O arquivo será enviado ao salvar o show.</p><label>Ou informar URL da imagem<input name="imagem_url" type="url" placeholder="https://..."></label><label>Link de divulgação<input name="link" type="url" placeholder="https://..."></label><button type="submit">Salvar show</button><button type="button" id="cancel">Cancelar edição</button></form><h2>Shows cadastrados</h2><div id="shows"></div></section></main><script>
(function(){
 const btn=document.getElementById('forgot-password'),notice=document.getElementById('notice');
 btn.addEventListener('click',async function(){
  const email=document.getElementById('email').value.trim();
  if(!email){notice.textContent='Informe seu e-mail primeiro.';return;}
  btn.disabled=true;notice.textContent='Solicitando e-mail de recuperação...';
  try{
   const res=await fetch('https://lydznydmkcwqtxukktyy.supabase.co/auth/v1/recover?redirect_to='+encodeURIComponent(location.origin+'/admin.html'),{
    method:'POST',headers:{'Content-Type':'application/json','apikey':'sb_publishable_jJ98f2Xpok2CrjJ4KfRFmA_ahQaWfAv'},
    body:JSON.stringify({email})
   });
   if(!res.ok){const body=await res.json().catch(()=>({}));throw new Error(body.msg||body.message||body.error_description||'Erro '+res.status)}
   notice.textContent='Solicitação enviada. Verifique sua caixa de entrada e spam. Caso não receba, confira as configurações de e-mail do Supabase.';
  }catch(e){notice.textContent='Não foi possível solicitar a recuperação: '+e.message;}
  finally{btn.disabled=false}
 });
})();
</script><script type="module" src="/admin.js"></script></body></html>
